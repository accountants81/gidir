name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck the app
        run: pnpm --filter @workspace/tax-invoice-converter run typecheck

      - name: Install Chromium for Playwright
        run: pnpm --filter @workspace/tax-invoice-converter exec playwright install --with-deps chromium

      - name: Build and run end-to-end tests
        run: pnpm --filter @workspace/tax-invoice-converter run test
